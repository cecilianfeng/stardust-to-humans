<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>从星尘到人类</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Layout: full-bleed film canvas; chapter + Earth-day clock along the top, caption lower-left, transport bar at the foot */
  --ink:#06070b;
  --paper:#efe8da;
  --muted:#a8a194;
  --ember:#f2a65a;
  --rule:rgba(239,232,218,.22);
  --glass:rgba(6,7,11,.5);
  --f-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--ink)}
body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.scrim{position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.74));pointer-events:none}
.ui{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto auto;gap:14px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;min-width:0}
.chap{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;color:var(--muted);text-shadow:0 1px 10px rgba(0,0,0,.7);padding-top:10px}
.chap b{color:var(--paper);font-weight:500;font-family:var(--f-body);letter-spacing:.1em;margin-left:6px}
.clock{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--rule);border-radius:999px;padding:5px 14px 5px 5px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.clock canvas{width:36px;height:36px;display:block}
.clock .lbl{font-size:11px;color:var(--muted);letter-spacing:.08em;line-height:1.2}
.clock .val{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums;color:var(--paper);line-height:1.3}
.cap{max-width:34em;min-width:0;transition:opacity .45s ease,transform .45s ease}
.cap.out{opacity:0;transform:translateY(10px)}
.cap .yr{font-family:var(--f-mono);font-size:13px;letter-spacing:.16em;color:var(--ember)}
.cap h2{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,5.4vw,62px);line-height:1.08;margin:.16em 0 .28em;text-wrap:balance;letter-spacing:.03em;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.cap p{margin:0;font-size:clamp(14px,1.55vw,17px);line-height:1.75;color:rgba(239,232,218,.9);max-width:30em;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.bar{display:flex;align-items:center;gap:10px;pointer-events:auto}
.ibtn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--glass);color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ibtn:hover{border-color:rgba(239,232,218,.5)}
.ibtn svg{width:16px;height:16px}
button:focus-visible,.track:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.track{position:relative;flex:1;min-width:0;height:30px;cursor:pointer;touch-action:none}
.rail{position:absolute;left:0;right:0;top:14px;height:2px;background:var(--rule)}
.fill{position:absolute;left:0;top:14px;height:2px;background:var(--ember);width:0}
.tick{position:absolute;top:10px;width:1px;height:10px;background:rgba(239,232,218,.35)}
.knob{position:absolute;top:9px;width:12px;height:12px;border-radius:50%;background:var(--paper);margin-left:-6px;box-shadow:0 0 0 3px rgba(242,166,90,.25)}
.time{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;background:radial-gradient(ellipse at center,rgba(6,7,11,.25),rgba(6,7,11,.88) 75%);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .6s ease}
.intro.gone{opacity:0;pointer-events:none}
.intro .kick{font-family:var(--f-mono);font-size:12px;letter-spacing:.24em;color:var(--ember)}
.intro h1{font-family:var(--f-display);font-weight:900;font-size:clamp(42px,9vw,96px);line-height:1.05;margin:0;letter-spacing:.06em;text-wrap:balance}
.intro p{margin:0;color:rgba(239,232,218,.82);font-size:clamp(14px,1.8vw,17px);line-height:1.7;max-width:26em}
.go{margin-top:10px;display:inline-flex;align-items:center;gap:10px;font-family:var(--f-body);font-size:16px;font-weight:500;color:var(--ink);background:var(--paper);border:0;border-radius:999px;padding:13px 26px 13px 20px;cursor:pointer;transition:transform .2s ease,background .2s ease}
.go:hover{transform:translateY(-1px);background:#fff}
.go svg{width:16px;height:16px}
.intro small{font-size:12px;color:var(--muted)}
@media (max-width:600px){
  .clock .lbl{font-size:10px}
  .clock .val{font-size:14px}
  .chap b{display:block;margin:4px 0 0}
  .time{display:none}
}
@media (prefers-reduced-motion:reduce){.cap,.intro,.go{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv" aria-label="动画：从宇宙诞生到人类出现"></canvas>
  <div class="scrim"></div>
  <div class="ui">
    <div class="top">
      <div class="chap" id="chap">01 / 13<b>宇宙诞生</b></div>
      <div class="clock" title="把地球 45.4 亿年的历史压缩成 24 小时">
        <canvas id="dial" width="72" height="72"></canvas>
        <div><div class="lbl" id="clbl">地球一日钟</div><div class="val" id="cval">--:--:--</div></div>
      </div>
    </div>
    <div></div>
    <div class="cap" id="cap" aria-live="polite">
      <div class="yr" id="cyr"></div>
      <h2 id="ctit"></h2>
      <p id="csub"></p>
    </div>
    <div class="bar">
      <button class="ibtn" id="bplay" aria-label="播放"><svg viewBox="0 0 16 16" id="iplay"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></button>
      <div class="track" id="track" tabindex="0" role="slider" aria-label="进度" aria-valuemin="0" aria-valuemax="122" aria-valuenow="0">
        <div class="rail"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div>
      </div>
      <div class="time" id="time">0:00 / 2:02</div>
      <button class="ibtn" id="bsnd" aria-label="静音"><svg viewBox="0 0 16 16" id="isnd"></svg></button>
      <button class="ibtn" id="bfs" aria-label="全屏"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </div>
  </div>
  <div class="intro" id="intro">
    <div class="kick" id="ikick">138 亿年 · 2 分钟</div>
    <h1 id="ititle">从星尘到人类</h1>
    <p id="isub">宇宙、地球，海洋、陆地与天空里的生命，还有我们自己是从哪里来的。</p>
    <button class="go" id="bgo"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg><span id="igo">开始播放</span></button>
    <small>建议打开声音 · 空格键暂停 · 方向键快进快退</small>
  </div>
</div>

<script>
(()=>{
/* ---------- utilities ---------- */
const TAU=Math.PI*2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(20261023);
const rnd=(a=0,b=1)=>a+R()*(b-a);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const mix=(c1,c2,t)=>c1.map((v,i)=>v+(c2[i]-v)*t);
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const buf=document.createElement('canvas'),bx=buf.getContext('2d');
let W=1,H=1,S=1,DPR=1;

/* ---------- seeded scenery ---------- */
const STARS=Array.from({length:420},()=>({x:R(),y:R(),r:Math.pow(R(),3)*1.7+0.4,tw:R()*TAU,c:R()}));
const GAL=Array.from({length:7},()=>({x:rnd(0.08,0.92),y:rnd(0.1,0.9),r:rnd(0.03,0.08),a:rnd(0,TAU),h:R()}));
const BB=Array.from({length:1100},()=>({a:R()*TAU,v:Math.pow(R(),0.6),s:R()*1.8+0.5,h:R()}));
const DISK=Array.from({length:1300},()=>({r:0.05+Math.pow(R(),0.9)*0.95,a:R()*TAU,s:R()*1.3+0.6,h:R(),y:(R()-0.5)*0.05}));
const PLAN=[{r:.13,s:2,c:[200,180,160],a:R()*TAU},{r:.22,s:3.4,c:[235,205,150],a:R()*TAU},{r:.35,s:3.8,c:[110,175,255],a:R()*TAU,earth:1},{r:.48,s:2.6,c:[225,120,90],a:R()*TAU},{r:.68,s:7.5,c:[225,195,155],a:R()*TAU},{r:.86,s:6.2,c:[235,215,165],a:R()*TAU}];
const LAVA=Array.from({length:42},()=>({u:R()*2-1,v:R()*1.8-0.9,r:R()*0.25+0.06,f:R()*TAU}));
const DEB=Array.from({length:420},()=>({a:(R()-0.5)*1.7,v:0.3+R()*0.9,s:R()*1.6+0.7,o:R()*TAU,rr:0.85+R()*0.4,h:R()}));
const CLOUD=Array.from({length:12},()=>({x:R(),y:R(),w:rnd(0.14,0.32),h:rnd(0.03,0.07),s:rnd(0.5,1.5)}));
const RAIN=Array.from({length:320},()=>({x:R(),y:R(),l:rnd(0.6,1.4),sp:rnd(0.9,1.4)}));
function boltPts(x0){const p=[[x0,0]];let x=x0,y=0;while(y<0.62){y+=rnd(0.03,0.07);x+=rnd(-0.035,0.035);p.push([x,y])}return p}
const BOLTS=[1.4,3.9,6.2].map(t=>({t,pts:boltPts(rnd(0.25,0.75))}));
const SNOW=Array.from({length:170},()=>({x:R(),y:R(),sp:rnd(0.5,1.5),f:R()*TAU,s:R()*1.6+0.5}));
const PLUME=Array.from({length:90},()=>({o:R(),f:R()*TAU}));
const CELLS=Array.from({length:16},()=>{const d0=rnd(0.4,3.8);return{x:rnd(0.36,0.94),y:rnd(0.25,0.78),s:R(),d0,dv:d0+1.6+R()*3,da:R()*TAU,f:R()*TAU,h:R()}});
const STR=Array.from({length:7},(_,i)=>({x:0.06+i*0.145+rnd(-0.03,0.03),w:rnd(0.05,0.09),h:rnd(0.08,0.17)}));
const BUB=Array.from({length:80},()=>({k:Math.floor(R()*7),o:R(),sp:rnd(0.7,1.3),s:R(),f:R()*TAU,lab:R()<0.14}));
const KELP=Array.from({length:20},()=>({x:R(),h:rnd(0.12,0.3),f:R()*TAU}));
const JELLY=Array.from({length:5},()=>({x:rnd(0.1,0.9),y:rnd(0.3,0.75),s:rnd(0.6,1.1),sp:rnd(0.7,1.3),f:R()*TAU}));
const TRI=Array.from({length:6},()=>({x:R(),sp:rnd(0.5,1.4),s:rnd(0.7,1.2),f:R()*TAU}));
const SCHOOL=Array.from({length:22},()=>({dx:rnd(-1,1),dy:rnd(-1,1),f:R()*TAU,s:rnd(0.75,1.2)}));
const PLANTS=Array.from({length:22},(_,i)=>({x:0.37+i*(0.63/22)+rnd(0,0.02),l:rnd(0.05,0.12),a:rnd(-0.15,0.15),f:R()*TAU}));
const SMOKE=Array.from({length:30},()=>({o:R(),f:R()*TAU}));
const CONIF=Array.from({length:16},()=>({x:R(),s:rnd(0.6,1.3),ty:R()<0.5?0:1}));
const PTERO=Array.from({length:4},()=>({o:R(),y:rnd(0.18,0.42),ph:R()*TAU,s:rnd(0.8,1.2)}));
const EMBER=Array.from({length:140},()=>({x:R(),o:R(),sp:rnd(0.6,1.4),s:R()}));
const GRASS=Array.from({length:260},()=>({x:R(),h:rnd(0.02,0.06),f:R()*TAU}));
const MAM=Array.from({length:5},()=>({o:R(),sp:rnd(0.5,1),ph:R()*TAU,dir:R()<0.5?1:-1,s:rnd(0.8,1.2)}));
const TREES=Array.from({length:7},()=>({x:R(),s:rnd(0.7,1.3),d:rnd(0,0.4)}));
const CITY=(()=>{const a=[];for(let c=0;c<16;c++){const th=rnd(-0.6,0.6),dd=rnd(0.01,0.28),n=10+Math.floor(R()*30);for(let i=0;i<n;i++)a.push({th:th+(R()-0.5)*0.12,d:Math.max(0.004,dd+(R()-0.5)*0.07),s:R()})}return a})();
const HOM=[
  {n:'撒海尔人',y:'700 万年前',hunch:0.75,arm:0.44,head:0.075,sc:0.78,snout:1},
  {n:'南方古猿',y:'320 万年前',hunch:0.42,arm:0.42,head:0.072,sc:0.74,snout:0.8},
  {n:'能人',y:'240 万年前',hunch:0.26,arm:0.38,head:0.075,sc:0.82,snout:0.5},
  {n:'直立人',y:'190 万年前',hunch:0.08,arm:0.34,head:0.074,sc:1.0,snout:0.3},
  {n:'智人',y:'30 万年前',hunch:0,arm:0.32,head:0.086,sc:1.0,snout:0}
];

/* ---------- drawing helpers ---------- */
function drawStars(g,t,a=1){
  if(a<=0.01)return;
  for(const s of STARS){
    const al=a*(0.4+0.6*Math.pow(Math.sin(t*1.2+s.tw),2));
    g.fillStyle=s.c>0.86?`rgba(255,210,170,${al})`:s.c<0.14?`rgba(170,200,255,${al})`:`rgba(255,255,255,${al})`;
    g.fillRect(s.x*W,s.y*H,s.r,s.r);
  }
}
function vgrad(g,stops){const gr=g.createLinearGradient(0,0,0,H);for(const [o,c] of stops)gr.addColorStop(o,c);g.fillStyle=gr;g.fillRect(0,0,W,H)}
function glow(g,x,y,r,c0,c1='rgba(0,0,0,0)'){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c0);gr.addColorStop(1,c1);g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
function ridgeY(x,base,amp,f,ph){return base+Math.sin(x/W*f*TAU+ph)*amp+Math.sin(x/W*f*2.7*TAU+ph*1.7)*amp*0.4}
function ridge(g,base,amp,f,ph,col){g.fillStyle=col;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W+12;x+=12)g.lineTo(x,ridgeY(x,base,amp,f,ph));g.lineTo(W,H);g.closePath();g.fill()}
function taper(g,p0,p1,p2,w0,w1,n=20){
  for(let i=0;i<=n;i++){const u=i/n,a=(1-u)*(1-u),b=2*(1-u)*u,c=u*u;
    g.beginPath();g.arc(a*p0[0]+b*p1[0]+c*p2[0],a*p0[1]+b*p1[1]+c*p2[1],Math.max(0.5,lerp(w0,w1,u)/2),0,TAU);g.fill()}
}
function vignette(g){const r=Math.hypot(W,H)/2;const v=g.createRadialGradient(W/2,H/2,r*0.42,W/2,H/2,r);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.55)');g.fillStyle=v;g.fillRect(0,0,W,H)}

/* ---------- creatures & plants ---------- */
function fish(g,x,y,s,dir,t,ph){g.save();g.translate(x,y);g.scale(dir,1);const w=Math.sin(t*9+ph)*0.35;
  g.beginPath();g.ellipse(0,0,s,s*0.32,0,0,TAU);g.fill();
  g.beginPath();g.moveTo(-s*0.85,0);g.lineTo(-s*1.5,-s*0.42+w*s*0.3);g.lineTo(-s*1.5,s*0.42+w*s*0.3);g.closePath();g.fill();g.restore()}
function jelly(g,x,y,s,t,ph){const pu=0.5+0.5*Math.sin(t*2.2+ph),w=s*(1+0.12*pu),hh=s*(0.75-0.15*pu);
  g.save();g.globalCompositeOperation='lighter';glow(g,x,y-hh*0.3,w*1.8,'rgba(255,170,230,0.35)');g.restore();
  g.fillStyle='rgba(255,205,238,0.55)';g.beginPath();g.ellipse(x,y,w,hh,0,Math.PI,TAU);g.closePath();g.fill();
  g.strokeStyle='rgba(255,215,242,0.45)';g.lineWidth=1.2;
  for(let i=0;i<6;i++){const tx=x-w*0.8+i*w*0.32;g.beginPath();g.moveTo(tx,y);for(let k=1;k<=8;k++)g.lineTo(tx+Math.sin(t*2+ph+k*0.7+i)*s*0.13,y+k*s*0.22);g.stroke()}}
function trilo(g,x,y,s,t,ph){g.save();g.translate(x,y);g.fillStyle='#5f4c3d';g.beginPath();g.ellipse(0,0,s,s*0.42,0,Math.PI,TAU);g.fill();
  g.strokeStyle='rgba(30,20,15,0.6)';g.lineWidth=1;
  for(let i=-3;i<=3;i++){g.beginPath();g.moveTo(i*s*0.22,0);g.lineTo(i*s*0.2,-s*0.38*Math.cos(i*0.35));g.stroke()}
  g.strokeStyle='#3d3027';for(let i=0;i<6;i++){const lx=-s*0.7+i*s*0.28;g.beginPath();g.moveTo(lx,0);g.lineTo(lx+Math.sin(t*8+i+ph)*s*0.1,s*0.14);g.stroke()}
  g.restore()}
function anomalo(g,x,y,s,t){g.save();g.translate(x,y);g.fillStyle='rgba(160,78,64,0.95)';
  for(let i=0;i<10;i++){const fx=-s*0.4+i*s*0.09,wv=Math.sin(t*5-i*0.6)*s*0.06;
    g.beginPath();g.ellipse(fx,-s*0.08+wv*0.3,s*0.06,Math.max(1,s*0.13+wv),0.4,0,TAU);g.fill();
    g.beginPath();g.ellipse(fx,s*0.08-wv*0.3,s*0.06,Math.max(1,s*0.13-wv),-0.4,0,TAU);g.fill()}
  g.beginPath();g.ellipse(0,0,s*0.5,s*0.1,0,0,TAU);g.fill();
  g.beginPath();g.moveTo(-s*0.48,0);g.lineTo(-s*0.68,-s*0.11);g.lineTo(-s*0.6,0);g.lineTo(-s*0.68,s*0.11);g.closePath();g.fill();
  g.strokeStyle='rgba(160,78,64,0.95)';g.lineWidth=s*0.035;g.lineCap='round';const cl=Math.sin(t*2);
  for(const sg of [1,-1]){g.beginPath();g.moveTo(s*0.47,sg*s*0.02);g.quadraticCurveTo(s*0.72,sg*s*0.06,s*0.66,sg*s*(0.17+cl*0.04)+s*0.05);g.stroke()}
  g.fillStyle='#1d0e0b';g.beginPath();g.arc(s*0.4,-s*0.11,s*0.03,0,TAU);g.fill();g.restore()}
function tetrapod(g,x,y,s,t){g.save();g.translate(x,y);g.fillStyle='#34402f';const ph=t*5;

  if(playing){const dt=Math.min(0.1,(now-last)/1000);T+=dt;
    for(const ev of EVENTS)if(prevT<ev.t&&T>=ev.t)boom(ev.s);
    prevT=T;if(T>=TOTAL){T=TOTAL;onEnd()}dirty=true}
  last=now;
  if(dirty){render(T);updateUI();dirty=false}
  requestAnimationFrame(frame)}

function resize(){DPR=Math.min(window.devicePixelRatio||1,1.75);W=Math.max(1,cv.clientWidth);H=Math.max(1,cv.clientHeight);S=Math.min(W,H);
  for(const c of [cv,buf]){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR)}
  ctx.setTransform(DPR,0,0,DPR,0,0);bx.setTransform(DPR,0,0,DPR,0,0);dirty=true;
  if(!started){render(SC[1].start+4.6)}}
window.addEventListener('resize',resize);
resize();
render(SC[1].start+4.6);
const poster=()=>{if(!started)render(SC[1].start+4.6)};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty=true});
requestAnimationFrame(now=>{last=now;
  /* first frame before play: keep the poster, but show UI state */
  updateUI();poster();
  const loop=n=>{if(!started){last=n;requestAnimationFrame(loop);return}frame(n)};requestAnimationFrame(loop)});
})();
</script>
